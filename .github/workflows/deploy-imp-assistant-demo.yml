name: 部署 IMP 助手 Demo

on:
  push:
    branches: [main]
    paths:
      - "imp-assistant-demo/**"
      - ".github/workflows/deploy-imp-assistant-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传 Demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./imp-assistant-demo"
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
